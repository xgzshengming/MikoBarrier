name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and smoke test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore .\MikoBarrier.sln

      - name: Build solution
        run: dotnet build .\MikoBarrier.sln -c Release --no-restore

      - name: Run core smoke tests
        run: dotnet run --project .\tools\SmokeTest\SmokeTest.csproj -c Release
