name: 💡 功能建议
description: 提议新功能或改进现有行为
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。MikoBarrier 的目标是「约束自己、不把 Windows 锁死」，因此请优先说明它是否会影响关机 / 注销 / 逃生通道 / 系统稳定性。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述当前的不便或缺口，以及这个问题出现的场景。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么做
      description: 描述你期望的功能或交互。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 替代思路
      description: 如果有其他实现方式或临时绕过办法，可以写在这里。
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 功能涉及模块
      options:
        - 自律计时 / 快照恢复
        - 键盘封锁
        - 黑名单 / 白名单
        - 断网 / hosts / 网卡
        - 任务 / 统计 / 主题
        - 巫女模式
        - 安装 / 自启 / 计划任务
        - 文档 / 构建 / 发布
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: 安全边界确认
      options:
        - label: 该功能不会阻止或明显拖延正常的关机 / 注销
          required: true
        - label: 该功能不会把 Windows 锁死，或让我无法恢复
          required: true
        - label: 我理解这类强制工具只应该在自己拥有或有权管理的电脑上使用
          required: true
